# The rule hooks, judged on GitHub. A session's hooks refuse a pull request that breaks the rules before it is made,
# but a session that never loaded them, or wrote to GitHub some way they do not read, could still get one through.
# This check holds every pull request to the same rules from main's own copy of `.claude/hooks/rules.mjs`: the
# body's lane, acceptance criteria and last line, no Claude credit, rules files kept apart from code, the open limit,
# and for lane 2 and 3 a passing review that names the head commit before it is ready. It sets the commit status
# `pr-rules` on the head, which main requires, and closes a pull request opened or reopened past the open limit.
# It runs again on every comment, so a review verdict posted as a comment clears it. It never runs the pull
# request's code: it checks out main and only reads the pull request's commits with git.
name: pr-rules

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  statuses: write
  pull-requests: write
  issues: write

concurrency:
  group: pr-rules-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  pr-rules:
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Read the pull request's commits (never run them)
        env:
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          SERVER: ${{ github.server_url }}
        run: |
          git fetch --no-tags "$SERVER/$GITHUB_REPOSITORY" "+refs/heads/${{ github.event.repository.default_branch }}:refs/remotes/origin/${{ github.event.repository.default_branch }}" "+refs/pull/$PR/head:refs/remotes/pr/head"
      - name: Every rule the hooks judge holds
        run: node .claude/hooks/rules.mjs --github-pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          PR_ACTION: ${{ github.event_name == 'pull_request_target' && github.event.action || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
