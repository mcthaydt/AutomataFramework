# The rules of docs/rules.md that a program can check about the repo's words and agent setup: the start-up pages stay
# short, no effort above high, every skill loads, every hook exists, and no file names a private demo game. It runs on
# every pull request, docs-only ones included, with Node alone: nothing is installed or built. The checks and their
# messages are in `scripts/check-agent-rules.ts`.
name: agent-rules

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: agent-rules-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  agent-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - run: node scripts/check-agent-rules.ts
