# One replay hash must come out the same in Node, Chromium, WebKit and Firefox. `plan` says how much this run tests;
# `check` runs the static checks and the Node tests; `browsers` runs the parity and browser tests, each browser in six
# shards side by side (18 jobs in a full run); `engines` names each browser's result, so a failing engine is named by its check. Every action
# is pinned to a commit.
#
# How much is tested (the Owner, 2026-11-15): while a pull request is a draft, a thread is still working on it, so only
# what its change reaches runs, and a run stops at its first failure. The whole suite runs once the pull request is
# ready for review, on every push to main, and on a draft that carries the `full-tests` label. A draft also runs in
# Chromium only (the Owner, 2026-11-16): WebKit and Firefox, and so the cross-browser parity proof, run in the full run
# that gates merge.
name: ci

on:
  pull_request:
    # `ready_for_review` starts the whole suite as a draft is handed over; `labeled` lets a thread ask for it sooner.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push stops the run it replaces, so no one waits on results that no longer count.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # How much this run tests, from the event and the files the pull request changes. Everything but `docs` is `true`
  # except on a draft without the `full-tests` label whose change leaves the build and the test setup alone:
  #   full     false: the Node and browser tests the change reaches (Vitest's `--changed`: the browser tests, and so
  #            the pictures they take, are only those whose files the change reaches), stopping at the first failure
  #   engines  the browsers the shards run in: Chromium only on a draft, all three otherwise
  #   docs     true when only Markdown that people read changed: `docs` passes every check main requires,
  #            under its own name, and every job that tests is left out
  #   quick    `quick ` on a draft, `skipped ` on a docs-only run, and empty otherwise: the start of every
  #            check's name, so a quick run never has the name of a check main requires, and only a full run (or
  #            `docs`) can let a pull request merge
  #   online   false when the networking and its journeys are untouched: the `online` job is left out
  #   package  false when the command, the template, the skills, the install checks and the README are untouched: the
  #            jobs that pack the package and make a new game from it are left out
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ steps.plan.outputs.full }}
      engines: ${{ steps.plan.outputs.engines }}
      online: ${{ steps.plan.outputs.online }}
      package: ${{ steps.plan.outputs.package }}
      docs: ${{ steps.plan.outputs.docs }}
      quick: ${{ steps.plan.outputs.docs == 'true' && 'skipped ' || steps.plan.outputs.full != 'true' && 'quick ' || '' }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          full=true online=true package=true docs=false
          engines='["chromium","webkit","firefox"]'
          if [ "$EVENT" = pull_request ] && [[ " $LABELS " != *" full-tests "* ]] &&
            changed="$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)" && [ -n "$changed" ]; then
            printf 'This pull request changes:\n%s\n' "$changed"
            # Only Markdown that people read (CLAUDE.md, the notes under docs/ and the sessions' skills under
            # .claude/skills/, never the README or a page a test reads): there is nothing to test, so `docs` passes
            # every check main requires at once, draft or not. The `agent-rules` workflow still checks those words.
            others="$(grep -vE '^(CLAUDE\.md|docs/.+\.md|\.claude/skills/.+\.md)$' <<<"$changed" || true)$(grep -E '^docs/api/' <<<"$changed" || true)"
            if [ -z "$others" ]; then
              docs=true
            # A change to how things are installed, built or tested, or to the shared test files, reaches every test.
            elif [ "$DRAFT" = true ] && ! grep -qE '^(tests/fixtures/|package\.json|pnpm-lock\.yaml|\.pnpmfile\.cjs|[^/]*\.config\.(ts|js)|vite-rapier-wasm\.ts|tsconfig[^/]*\.json|\.github/)' <<<"$changed"; then
              full=false engines='["chromium"]'
              # The `screenshots` label asks for the online journeys, which take the pictures, on any draft.
              grep -qE '^(src/server\.ts|src/features/(net|server)/|tests/journeys/)' <<<"$changed" ||
                [[ " $LABELS " == *" screenshots "* ]] || online=false
              grep -qE '^(src/(cli|headless|index|server)\.ts|src/features/cli/|template/|skills/|scripts/|tests/install/|tests/create/|tests/golden/|README\.md)' <<<"$changed" || package=false
            fi
          fi
          echo "docs=$docs full=$full engines=$engines online=$online package=$package"
          { echo "docs=$docs"; echo "full=$full"; echo "engines=$engines"; echo "online=$online"; echo "package=$package"; } >> "$GITHUB_OUTPUT"

  # A pull request that changes only Markdown that people read has nothing to test (the Owner, 2026-11-15). This job
  # stands in for every check main requires, under its exact name, and passes at once. Every job that tests is left out
  # and has `skipped ` at the start of its name, so a skipped job never wears a required name, and on any other run this
  # job's own names start with `docs only `.
  docs:
    needs: plan
    if: needs.plan.outputs.docs == 'true'
    name: ${{ needs.plan.outputs.docs == 'true' && matrix.check || format('docs only {0}', matrix.check) }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        check:
          - 'check'
          - 'package'
          - 'engines (chromium)'
          - 'engines (webkit)'
          - 'engines (firefox)'
          - 'online'
          - 'create (ubuntu-latest)'
          - 'create (windows-latest)'
          - 'create (macos-latest)'
          - 'create-play'
    env:
      CHECK: ${{ matrix.check }}
    steps:
      - run: echo "Only Markdown that people read changed, so there is nothing to test, and $CHECK passes."

  check:
    needs: plan
    if: needs.plan.outputs.docs != 'true'
    name: ${{ needs.plan.outputs.quick }}check
    runs-on: ubuntu-latest
    env:
      # On a draft: the tests the change reaches, stopping at the first failure.
      ONLY: ${{ needs.plan.outputs.full != 'true' && '--changed=origin/main --bail=1 --passWithNoTests' || '' }}
    steps:
      # The whole history, so `--changed` can compare with `origin/main`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm knip
      # The room server's process test starts the built package, as a game's own server file does.
      - run: pnpm build
      - run: pnpm test:node $ONLY

  # Each browser in six shards that run side by side, so a full run is 18 jobs (the Owner, 2026-11-16). A draft runs
  # Chromium only: the `engines` list comes from `plan`.
  browsers:
    needs: plan
    if: needs.plan.outputs.docs != 'true'
    name: browsers (${{ matrix.engine }} ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    strategy:
      # On a draft the first failure stops the other shards too; the whole suite lets every shard finish.
      fail-fast: ${{ needs.plan.outputs.full != 'true' }}
      matrix:
        engine: ${{ fromJSON(needs.plan.outputs.engines) }}
        shard: [1, 2, 3, 4, 5, 6]
    env:
      ONLY: ${{ needs.plan.outputs.full != 'true' && '--changed=origin/main --bail=1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser is kept between runs, by Playwright's version; the system libraries it needs are put in each time.
      - id: version
        run: echo "playwright=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browser
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.version.outputs.playwright }}-${{ matrix.engine }}
      - if: steps.browser.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps ${{ matrix.engine }}
      - if: steps.browser.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps ${{ matrix.engine }}
      - run: pnpm test:engine ${{ matrix.engine }} --shard=${{ matrix.shard }}/6 $ONLY
      # Pictures a person looks at (the drunk-grandma check); nothing compares them.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: screens-${{ matrix.engine }}-${{ matrix.shard }}
          path: tests/**/__screenshots__/**
          if-no-files-found: ignore

  # One check per browser, `engines (<browser>)`, green only when all six of that browser's shards passed, so the names
  # main's protection asks for stay as they were. A draft has only Chromium's.
  engines:
    needs: [plan, browsers]
    name: ${{ needs.plan.outputs.quick }}engines (${{ matrix.engine }})
    # Also on a run a newer one cancelled, so that run shows red: a skipped check would count as passed.
    if: always() && needs.plan.outputs.docs != 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJSON(needs.plan.outputs.engines) }}
    env:
      GH_TOKEN: ${{ github.token }}
      # The shards each browser is split into: the `shard` list of the `browsers` job.
      SHARDS: 6
    steps:
      - name: Every shard of ${{ matrix.engine }} passed
        run: |
          set -euo pipefail
          results="$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --attempt "$GITHUB_RUN_ATTEMPT" --json jobs \
            --jq '.jobs[] | select(.name | startswith("browsers (${{ matrix.engine }} ")) | "\(.name): \(.conclusion)"')"
          echo "$results"
          [ "$(grep -c ': success$' <<<"$results")" -eq "$SHARDS" ]

  # Proof 3 of the networking: two real browsers play one room on a server started here. It needs the built package (the
  # server is `dist/`, as a game's own server file would be), and all three browsers because every engine plays.
  online:
    needs: plan
    name: ${{ needs.plan.outputs.quick }}online
    if: needs.plan.outputs.docs != 'true' && needs.plan.outputs.online == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser is kept between runs, by Playwright's version; the system libraries it needs are put in each time.
      - id: version
        run: echo "playwright=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browser
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.version.outputs.playwright }}-all
      - if: steps.browser.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium webkit firefox
      - if: steps.browser.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium webkit firefox
      - run: pnpm build
      - run: pnpm test:journeys
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: screens-online
          path: tests/journeys/__screenshots__/**
          if-no-files-found: ignore

  # The package as a game gets it: built, packed, installed into an empty folder, run, and typechecked there.
  package:
    needs: plan
    name: ${{ needs.plan.outputs.quick }}package
    if: needs.plan.outputs.docs != 'true' && needs.plan.outputs.package == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm schemas --check
      - run: pnpm api-report
      - run: pnpm pack --pack-destination "$RUNNER_TEMP/pack"
      - name: Install the packed package in an empty folder, run it and typecheck against it
        run: |
          smoke="$RUNNER_TEMP/smoke"
          mkdir "$smoke"
          cp tests/install/* tests/fixtures/xxhash64-reference.ts tests/golden/push-crate.json tests/golden/playground.json tests/golden/art.json "$smoke"/
          cp -r tests/fixtures/game "$smoke/game"
          cp -r tests/fixtures/full-game "$smoke/full-game"
          cp -r tests/fixtures/playground "$smoke/playground"
          cd "$smoke"
          echo '{ "private": true, "type": "module" }' > package.json
          npm install --no-audit --no-fund "$RUNNER_TEMP"/pack/*.tgz
          node smoke.mjs
          node server-smoke.mjs
          "$GITHUB_WORKSPACE/node_modules/.bin/tsc" -p .
          # The same file again with the older TypeScript and NodeNext resolution, the way a game on either would read it.
          node "$GITHUB_WORKSPACE/node_modules/typescript-6/bin/tsc" -p tsconfig.ts6.json
      - name: The packed package holds the command, the template and the skills
        run: node tests/install/tarball.mjs "$RUNNER_TEMP"/pack/*.tgz

  # The package once, as a release would ship it: the next two jobs install these very bytes, never the working folder.
  create-pack:
    needs: plan
    name: ${{ needs.plan.outputs.quick }}create-pack
    if: needs.plan.outputs.docs != 'true' && needs.plan.outputs.package == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm pack --pack-destination "$RUNNER_TEMP/pack"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: create-tarball
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error

  # The README's "Start here" in a clean folder, on each system a person may use: a new game is made, installed,
  # checked, changed, broken and served, using only Node and the tarball. One key in the matrix, and a name that is
  # `create (<os>)` on a full run, so the checks are `create (ubuntu-latest)`, `create (windows-latest)` and
  # `create (macos-latest)`.
  create:
    # Left out with create-pack, when a draft does not touch the package.
    needs: [create-pack, plan]
    name: ${{ needs.plan.outputs.quick }}create (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      # The commit the game's `github:` route installs, on the one system that tries it.
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Get the tarball create-pack made
        shell: bash
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name create-tarball --dir "$RUNNER_TEMP/tarball"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: node tests/install/create-smoke.mjs "${{ runner.temp }}/tarball"

  # The same new game in real browsers: Chromium, WebKit and Firefox, at five sizes, by key and by touch.
  create-play:
    # Left out with create-pack, when a draft does not touch the package.
    needs: [create-pack, plan]
    name: ${{ needs.plan.outputs.quick }}create-play
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser is kept between runs, by Playwright's version; the system libraries it needs are put in each time.
      - id: version
        run: echo "playwright=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browser
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.version.outputs.playwright }}-all
      - if: steps.browser.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium webkit firefox
      - if: steps.browser.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium webkit firefox
      - name: Get the tarball create-pack made
        shell: bash
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name create-tarball --dir "$RUNNER_TEMP/tarball"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: pnpm test:create
        env:
          CREATE_TARBALL: ${{ runner.temp }}/tarball
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: screens-create
          path: tests/create/__screenshots__/**
          if-no-files-found: ignore
