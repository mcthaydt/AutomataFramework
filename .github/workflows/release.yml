# Releases are big and few (the Owner, 2026-11-13): Release 1 is the finished 2D framework, Release 2 the 2D editors,
# Release 3 the website, Release 4 distribution, Release 5 3D, and that loop repeats for 3D. Small releases come back
# only once the product is feature complete. So this never starts by itself: nothing reaches npm when `ci` passes on
# `main`. The Owner starts it by hand from `main` (Actions, release, Run workflow) when a release is due.
#
# The version is carried by a pull request (`pnpm changeset version`); nothing is pushed to `main` by a bot. Before
# anything is built, the job checks that `ci` passed for a push of this exact commit to `main`, so a commit whose checks
# failed, or never ran, cannot reach npm. `changeset publish` then publishes the version only if npm does not have it
# yet, with provenance, so npm shows which commit and run built it, and the tag is pushed.
name: release

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  id-token: write

concurrency: release

jobs:
  release:
    # A manual start must be on `main`.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The CI gate: the newest `ci` run for a push of this commit to `main` must have passed.
      - name: Check ci passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          conclusion="$(gh run list --workflow ci --branch main --event push --commit "$GITHUB_SHA" \
            --limit 1 --json conclusion --jq '.[0].conclusion // ""')"
          if [ "$conclusion" != "success" ]; then
            echo "::error::ci has not passed on $GITHUB_SHA (its result: '${conclusion:-no run}'). Nothing was published."
            exit 1
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # `changeset publish` makes an annotated tag, and git needs a name for that.
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # Publishes only when package.json's version is not on npm yet, and tags it in this checkout.
      - run: pnpm changeset publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
      # `changeset publish` tags only in this checkout, so the tags are pushed by hand. Only tags: the checkout is a
      # detached commit of `main`, which is protected and is never pushed to.
      - run: git push origin --tags
