# A release is a pull request that carries the version change (`pnpm changeset version`); nothing is pushed to `main`
# by a bot. When such a pull request merges, this publishes the version if npm does not have it yet, then pushes its
# tag. The package is published with provenance, so npm shows which commit and run built it.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Publishes only when package.json's version is not on npm yet, and tags it in this checkout.
      - run: pnpm changeset publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
      # `changeset publish` tags only here, so the tag is pushed by hand.
      - run: git push --follow-tags
